[package]
name = "evolish"
version = "0.1.0"
description = "Evolish desktop application core"
license = "Apache-2.0"
repository = "https://github.com/NotionNest/Evolish"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "evolish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
