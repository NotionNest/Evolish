[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Transitive proc-macro dependency of Tauri's required GTK3 stack; no safe upstream upgrade is available." },
  { id = "RUSTSEC-2024-0411", reason = "Tauri Linux requires the GTK3 Wayland bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0412", reason = "Tauri Linux requires the GTK3 GDK bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0413", reason = "Tauri Linux requires the GTK3 ATK bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0414", reason = "Tauri Linux requires the GTK3 X11 bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0415", reason = "Tauri Linux requires GTK3 through WebKitGTK; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0416", reason = "Tauri Linux requires the GTK3 ATK sys bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0417", reason = "Tauri Linux requires the GTK3 GDK X11 bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0418", reason = "Tauri Linux requires the GTK3 GDK sys bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0419", reason = "Tauri Linux requires the GTK3 macro crate; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2024-0420", reason = "Tauri Linux requires the GTK3 sys bindings; Tauri has no maintained GTK4 backend yet." },
  { id = "RUSTSEC-2025-0075", reason = "Transitive urlpattern dependency in Tauri utilities; no safe upstream upgrade is available." },
  { id = "RUSTSEC-2025-0080", reason = "Transitive urlpattern dependency in Tauri utilities; no safe upstream upgrade is available." },
  { id = "RUSTSEC-2025-0081", reason = "Transitive urlpattern dependency in Tauri utilities; no safe upstream upgrade is available." },
  { id = "RUSTSEC-2025-0098", reason = "Transitive urlpattern dependency in Tauri utilities; no safe upstream upgrade is available." },
  { id = "RUSTSEC-2025-0100", reason = "Transitive urlpattern dependency in Tauri utilities; no safe upstream upgrade is available." },
  { id = "RUSTSEC-2026-0194", reason = "plist 1.8 constrains quick-xml to 0.38; Evolish does not parse user-controlled XML and will upgrade when upstream permits 0.41+." },
  { id = "RUSTSEC-2026-0195", reason = "plist 1.8 constrains quick-xml to 0.38; Evolish does not parse user-controlled XML and will upgrade when upstream permits 0.41+." },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
